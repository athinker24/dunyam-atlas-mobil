# Dunya dosyalari ya da motor degisince atlas verisini YENIDEN URETIR ve
# commit eder. Boylece telefondaki uygulamanin verisini guncellemek icin
# masaustune gerek yok: dunya/dunyam.json'u GitHub'da duzenlemek yeter.
name: atlas verisi

on:
  push:
    paths:
      - 'dunya/**'
      - 'motor/**'
      - 'uret.py'
      - 'doku.py'
      - '.github/workflows/veri.yml'
  workflow_dispatch:
    inputs:
      res:
        description: 'cozunurluk (derece/hucre)'
        default: '0.25'

# Iki kosu ayni anda data/atlas.json'u commit etmeye kalkarsa ikincisi
# push'ta catisir. Ust uste push'ta eskisi iptal edilir.
concurrency:
  group: atlas-verisi
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: veriyi uret
        # uret.py dokulari (doku.png, yukseklik.png, kabartma.jpg) ciktinin
        # yanina yazar; hepsi birlikte tasinir.
        run: python uret.py --res "${{ github.event.inputs.res || '0.25' }}" --cikti /tmp/yeni/atlas.json --ozet
      # Dosyayi dogrudan yazip "git diff" ile bakmak ISE YARAMAZ: her ciktida
      # bir "uretim" zaman damgasi var, yani dosya iklim hic degismese de her
      # kosuda farkli cikar ve 2 MB'lik bos commit'ler birikir. Icerik ozeti
      # olan "surum" alani karsilastirilir; ayni ise dosyaya hic dokunulmaz.
      - name: degisti mi
        run: |
          python - <<'PY'
          import json, os, shutil
          yeni = json.load(open("/tmp/yeni/atlas.json", encoding="utf-8"))["surum"]
          try:
              eski = json.load(open("data/atlas.json", encoding="utf-8"))["surum"]
          except Exception:
              eski = None
          degisti = yeni != eski
          if degisti:
              for ad in os.listdir("/tmp/yeni"):
                  shutil.move(os.path.join("/tmp/yeni", ad), os.path.join("data", ad))
          print("surum %s -> %s%s" % (eski, yeni, "" if degisti else "  (ayni)"))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("DEGISTI=" + str(int(degisti)) + chr(10))
          PY
      # Yeni veriyle uygulama gercekten aciliyor mu? Dusen test commit'i
      # durdurur: bozuk veri telefona gitmez (test/uygulama_test.js).
      - uses: actions/setup-node@v4
        if: env.DEGISTI == '1'
        with:
          node-version: '22'
      - name: uygulama testi
        if: env.DEGISTI == '1'
        run: |
          npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
          # yayinlanan kume (site/) test edilir; site/ .gitignore'da, commit'e girmez
          sh yayinla.sh && node test/uygulama_test.js site
      - name: degistiyse commit et
        if: env.DEGISTI == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Veri: uret.py ile yeniden uretildi (${GITHUB_SHA::7})"
          # Kosu ~12 dk suruyor (aylar paralel; siraliyken ~20). O arada bu yolu tetiklemeyen bir commit
          # (or. yalniz app.js) dala gelirse duz push reddediliyordu ve veri
          # guncellenmeden is dusuyordu. Once uzaktakinin ustune tasi.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
