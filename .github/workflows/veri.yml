# Dunya dosyalari ya da motor degisince atlas verisini YENIDEN URETIR ve
# commit eder. Boylece telefondaki uygulamanin verisini guncellemek icin
# masaustune gerek yok: dunya/dunyam.json'u GitHub'da duzenlemek yeter.
name: atlas verisi

on:
  push:
    paths:
      - 'dunya/**'
      - 'motor/**'
      - 'uret.py'
      - '.github/workflows/veri.yml'
  workflow_dispatch:
    inputs:
      res:
        description: 'cozunurluk (derece/hucre)'
        default: '0.25'

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: veriyi uret
        run: python uret.py --res "${{ github.event.inputs.res || '0.25' }}" --ozet
      - name: degistiyse commit et
        run: |
          if git diff --quiet -- data/atlas.json; then
            echo "veri degismedi"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas.json
          git commit -m "Veri: uret.py ile yeniden uretildi (${GITHUB_SHA::7})"
          git push
