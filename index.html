<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dünyam Atlası</title>
<meta name="theme-color" content="#0b1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="harita" aria-label="Harita">
  <canvas id="gl"></canvas>
  <canvas id="bitki" hidden></canvas>
  <canvas id="toprak" hidden></canvas>
  <canvas id="yasam" hidden></canvas>
  <canvas id="tarim" hidden></canvas>
  <canvas id="su"></canvas>
  <canvas id="tekt" hidden></canvas>
  <canvas id="parcacik" hidden></canvas>
  <svg id="kaplama" aria-hidden="true"></svg>
</main>

<header id="baslik">
  <div class="marka">
    <h1>Dünyam</h1>
    <p id="altbaslik">İklim sınıfları</p>
  </div>
  <div class="araclar">
    <button class="ikon" id="sigdir" aria-label="Kıtaya sığdır">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="ikon" id="menu" aria-label="Ayarlar ve veri">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
</header>

<section id="kart" aria-live="polite" hidden>
  <button class="ikon kapat" id="kart-kapat" aria-label="Kartı kapat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="kart-icerik"></div>
</section>

<nav id="dok" aria-label="Katman">
  <div id="aciklama"></div>
  <div id="donem" role="radiogroup" aria-label="Dönem" hidden></div>
  <div id="sekmeler" role="tablist">
    <button role="tab" data-k="iklim" aria-selected="true">İklim</button>
    <button role="tab" data-k="sicaklik" aria-selected="false">Sıcaklık</button>
    <button role="tab" data-k="yagis" aria-selected="false">Yağış</button>
    <button role="tab" data-k="kar" aria-selected="false">Kar</button>
    <button role="tab" data-k="arazi" aria-selected="false">Arazi</button>
    <button role="tab" data-k="dolasim" aria-selected="false">Dolaşım</button>
  </div>
</nav>

<section class="sayfa" id="sayfa-siniflar" aria-label="İklim sınıfları" hidden>
  <header><h2>İklim sınıfları</h2><button class="ikon kapat" data-kapat aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <p class="not">Paylar kara alanına göre, enlemle küçülen hücre alanı hesaba katılarak. Bir sınıfa dokununca haritada yalnız o kalır.</p>
  <div id="sinif-listesi"></div>
</section>

<section class="sayfa cekmece" id="sayfa-ayar" aria-label="Ayarlar ve veri" hidden>
  <div class="tutamak" aria-hidden="true"></div>
  <header><h2>Görünüm ve veri</h2><button class="ikon kapat" data-kapat aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <h3>Görünüm</h3>
  <label class="anahtar"><span>Kabartma gölgesi<small>Birleşik: biçim yükseklik haritasından, doku editör görselinden</small></span><input type="checkbox" id="ay-kabartma" checked><i></i></label>
  <div class="secim uclu" id="kabartma-kaynak" role="radiogroup" aria-label="Kabartma kaynağı">
    <button role="radio" data-kaynak="bir" aria-checked="true">Birleşik</button>
    <button role="radio" data-kaynak="editor" aria-checked="false">Editör</button>
    <button role="radio" data-kaynak="gri" aria-checked="false">Yükseklik</button>
  </div>
  <label class="anahtar"><span>Piksel görünümü<small>Yumuşatma yok, modelin hücreleri olduğu gibi</small></span><input type="checkbox" id="ay-piksel"><i></i></label>
  <label class="anahtar"><span>Göller ve nehirler<small>Uzaktan yalnız büyük ana kollar; yakınlaştıkça kollar açılır</small></span><input type="checkbox" id="ay-su" checked><i></i></label>
  <div class="secim" id="su-kollar" role="radiogroup" aria-label="Nehir kolları">
    <button role="radio" data-sukol="ana" aria-checked="true">Ana kollar</button>
    <button role="radio" data-sukol="tum" aria-checked="false">Bütün kollar</button>
  </div>
  <label class="anahtar"><span>Deniz dokusu<small>Deneme, yalnız görünüş: sığ/derin tonu kıyıya uzaklıktan</small></span><input type="checkbox" id="ay-deniz" checked><i></i></label>
  <label class="anahtar"><span>Enlem ve boylam<small>30° aralıklı, yakınlaşınca 10°</small></span><input type="checkbox" id="ay-izgara" checked><i></i></label>
  <label class="anahtar"><span>Bantlı renk<small>Sıcaklık ve yağış altı eşit alanlı banda iner</small></span><input type="checkbox" id="ay-bant"><i></i></label>
  <h3>Dünya</h3>
  <dl id="kunye"></dl>
  <h3>İç tutarlılık <b id="tutarlilik-say"></b></h3>
  <div id="tutarlilik"></div>
  <h3>Veri</h3>
  <p class="not" id="surum"></p>
  <button class="genis" id="guncelle">Güncellemeleri denetle</button>
</section>

<div id="bildirim" role="status" hidden></div>
<div id="yukleniyor"><span>Atlas yükleniyor</span></div>
<script src="app.js"></script>
</body>
</html>
